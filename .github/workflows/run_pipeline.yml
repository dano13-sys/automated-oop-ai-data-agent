name: Weather Warehouse Automation Engine

on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'

jobs:
  run-data-platform:
    runs-on: ubuntu-latest

    steps:
      - name: Pull Down Code Repository Assets
        uses: actions/checkout@v4

      - name: Initialize Virtual Python Environment Sandbox
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Compile and Install Platform Packages
        run: |
          python -m pip install --upgrade pip
          pip install requests duckdb dbt-duckdb

      - name: Trigger Master End-to-End Orchestration Loop
        env:
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
        run: python ingestor.py