name: Weather Warehouse Automation Engine

on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'
  
permissions:
  contents: write


jobs:
  run-data-platform:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Initialize Virtual Python Environment Sandbox
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          #cache: 'pip'

      - name: Compile and Install Platform Packages
        run: |
          python -m pip install --upgrade pip
          pip install requests duckdb dbt-duckdb google-genai requests

      - name: Verify dbt Project Profile Mapping
        run: |
          dbt debug --profiles-dir .

      - name: Trigger Master End-to-End Orchestration Loop
        env:
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: | 
          python ingestor.py

      - name: Persist and Publish AI Reports to GitHub Repo
        run: |
          git config --global user.name "GitHub Actions Automation Bot"
          git config --global user.email "actions@github.com"

          # Stage the newly created/updated report file
          git add LATEST_METEROLOGY_REPORT.md

          #Only commit if the AI report actually contains new or changed text
          git diff-index --quiet HEAD || git commit -m "Hourly Platform Update: Materialized Gemini Safety Intelligence"

          git push origin master